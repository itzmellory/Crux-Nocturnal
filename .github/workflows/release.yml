name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automatic-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Calculate next version
        id: version
        shell: bash
        run: |
          git fetch --tags --force
          LAST_TAG="$(git tag --list '[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [[ -z "$LAST_TAG" ]]; then
            VERSION="0.1"
          else
            MAJOR="${LAST_TAG%%.*}"
            MINOR="${LAST_TAG#*.}"
            MINOR=$((MINOR + 1))
            if (( MINOR >= 10 )); then
              MAJOR=$((MAJOR + 1))
              MINOR=0
            fi
            VERSION="${MAJOR}.${MINOR}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Next release: $VERSION"

      - name: Build mod
        run: gradle clean jar -PreleaseVersion="${{ steps.version.outputs.version }}"

      - name: Prepare release asset
        run: |
          mkdir -p release
          cp build/libs/CruxNocturnalWorks.jar "release/CruxNocturnalWorks-${{ steps.version.outputs.version }}.jar"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Crux Nocturnal Works ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release/CruxNocturnalWorks-${{ steps.version.outputs.version }}.jar
          fail_on_unmatched_files: true
