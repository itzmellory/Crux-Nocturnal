plugins {
    id 'java'
}
sourceSets {
    main {
        java { srcDirs = ['src'] }
    }
}
group = 'cruxnocturnalworks'
version = providers.gradleProperty('releaseVersion').getOrElse('0.1')
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
repositories {
    mavenCentral()
    maven {
        url = uri('https://maven.xpdustry.com/mindustry')
    }
}
dependencies {
    compileOnly 'com.github.Anuken.Mindustry:core:v154'
}
jar {
    archiveFileName = 'CruxNocturnalWorks.jar'
    from('mod.hjson')
    from('icon.png')
    from('sprites') {
        into 'sprites'
        include '**/*.png'
    }
    from('sounds') {
        into 'sounds'
        include '**/*.ogg', '**/*.wav'
    }
    from('maps') {
        into 'maps'
        include '**/*.msav'
    }
}
